# Private graders for the agent-suitability suite (`vgi-lint simulate`).
#
# The prompts are published in the catalog's vgi.agent_test_tasks tag
# (crates/code-worker/src/lib.rs); the answers live here, keyed by task
# name, so the agent being graded never sees them. vgi-lint discovers this
# file in the directory it runs from. Every task passes its source inline,
# so the suite needs no external fixtures.

tasks:
  - name: detect_language
    reference_sql: "SELECT code.main.language_of('server.py')"
    ignore_column_names: true
  - name: count_functions
    reference_sql: "SELECT code.main.count_functions('fn a() {} fn b() {} fn c() {}', 'rust')"
    ignore_column_names: true
  - name: count_lines
    reference_sql: "SELECT code.main.count_lines('fn a() {}\nfn b() {}\nfn c() {}\n')"
    ignore_column_names: true
  - name: extract_imports
    reference_sql: "SELECT UNNEST(code.main.extract_imports('import os\nimport sys', 'python'))"
    unordered: true
    ignore_column_names: true
  - name: list_symbols
    reference_sql: "SELECT name FROM code.main.symbols('fn a() {} struct S {}', 'rust')"
    unordered: true
    ignore_column_names: true
  - name: supported_languages
    reference_sql: "SELECT language FROM code.main.supported_languages"
    unordered: true
    ignore_column_names: true
  - name: count_loc
    reference_sql: "SELECT code.main.loc('fn a() {}\n// note\nfn b() {}\n', 'rust')"
    ignore_column_names: true
  - name: extract_comments
    reference_sql: "SELECT UNNEST(code.main.extract_comments('// header\nfn a() {}\n', 'rust'))"
    unordered: true
    ignore_column_names: true
  - name: extract_strings
    reference_sql: "SELECT UNNEST(code.main.extract_strings('let s = \"hello\";\n', 'rust'))"
    unordered: true
    ignore_column_names: true
  - name: ts_query_names
    reference_sql: "SELECT UNNEST(code.main.ts_query('fn alpha() {}\nfn beta() {}\n', 'rust', '(function_item name: (identifier) @n)'))"
    unordered: true
    ignore_column_names: true
  - name: ts_nodes_captures
    reference_sql: "SELECT text FROM code.main.ts_nodes('fn alpha() {}\nfn beta() {}\n', 'rust', '(function_item name: (identifier) @n)') ORDER BY seq"
    ignore_column_names: true
  - name: todo_owner_function
    reference_sql: "SELECT s.name FROM code.main.symbols('fn load() {\n    // TODO: retry\n}\nfn save() {\n    // ok\n}\n', 'rust') AS s JOIN code.main.ts_nodes('fn load() {\n    // TODO: retry\n}\nfn save() {\n    // ok\n}\n', 'rust', '(line_comment) @c') AS c ON c.start_line BETWEEN s.start_line AND s.end_line WHERE s.kind = 'function' AND c.text LIKE '%TODO%'"
    ignore_column_names: true
  - name: language_most_functions
    reference_sql: "SELECT code.main.language_of(f.path) FROM (VALUES ('util.py', 'def a(): pass\n'), ('main.go', 'package m\nfunc A() {}\nfunc B() {}\nfunc C() {}\n'), ('lib.rs', 'fn x() {}\nfn y() {}\n')) AS f(path, src) ORDER BY code.main.count_functions(f.src, code.main.language_of(f.path)) DESC LIMIT 1"
    ignore_column_names: true
